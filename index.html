<script>
'use strict';
// =====================================================================
//  ASCHENPFAD – 2D Souls-like  (v0.6)
// =====================================================================
const VW = 960, VH = 540, T = 32, W = 424, H = 17, G = 1900, STEP = 1 / 60, AG = 500;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const lerp = (a, b, t) => a + (b - a) * clamp(t, 0, 1);
const ease = x => 1 - (1 - clamp(x, 0, 1)) ** 2;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rnd = (a, b) => a + Math.random() * (b - a);
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// ================================================================ CANVAS-PIPELINE
let cv = document.getElementById('c');
const sceneC = mkCanvas(VW, VH), sctx = sceneC.getContext('2d');
const bgC = mkCanvas(VW, VH), bgx = bgC.getContext('2d');
const wC = mkCanvas(VW, VH), wctx = wC.getContext('2d');
const maskC = mkCanvas(VW, VH), mctx = maskC.getContext('2d');
const lC = mkCanvas(VW / 2, VH / 2), lctx = lC.getContext('2d');
const tmpC = mkCanvas(VW, VH), tmpx = tmpC.getContext('2d');
let ctx = sctx;   // aktueller Zeichenkontext
let gl = null, out2d = null, progHi = null, progLo = null, glTex = null;
const VS = 'attribute vec2 a;varying vec2 v;void main(){v=vec2(a.x*.5+.5,.5-a.y*.5);gl_Position=vec4(a,0.,1.);}';
const FS_COMMON = `precision mediump float;uniform sampler2D t;uniform vec2 r;uniform float tm,hurt;varying vec2 v;
float rnd(vec2 c){return fract(sin(dot(c,vec2(12.9898,78.233)))*43758.5453);}`;
const FS_HI = FS_COMMON + `void main(){vec2 d=v-.5;float k=dot(d,d);vec2 ca=d*k*.014;
vec3 c=vec3(texture2D(t,v+ca).r,texture2D(t,v).g,texture2D(t,v-ca).b);
vec3 b=vec3(0.);
for(int i=0;i<10;i++){float a=float(i)*.6283+.3;vec2 o=vec2(cos(a),sin(a))/r;
b+=max(texture2D(t,v+o*4.).rgb-.45,0.)+max(texture2D(t,v+o*10.).rgb-.45,0.)*.75+max(texture2D(t,v+o*20.).rgb-.45,0.)*.45;}
c+=b*.13;

c*=mix(vec3(.84,.92,1.08),vec3(1.08,1.,.88),smoothstep(.12,.7,l));

float l=dot(c,vec3(.299,.587,.114));c=mix(vec3(l),c,.78);c*=1.-k*1.2;
c=mix(c,vec3(.32,0.,0.),hurt*smoothstep(.08,.45,k));gl_FragColor=vec4(c,1.);}`;
function initGL() {
  try {
    gl = cv.getContext('webgl', { antialias: false, alpha: false });
    if (!gl) throw new Error('kein WebGL');

      const p = gl.createProgram();
      for (const [type, src] of [[gl.VERTEX_SHADER, VS], [gl.FRAGMENT_SHADER, fs]]) {
        const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);

        gl.attachShader(p, s);

      gl.bindAttribLocation(p, 0, 'a'); gl.linkProgram(p);

    };

    const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  } catch (e) {
    console.warn('WebGL nicht verfügbar – 2D-Modus', e);
    gl = null;
    const n = mkCanvas(VW, VH); n.id = 'c'; n.tabIndex = 0; cv.replaceWith(n); cv = n; out2d = cv.getContext('2d');
  }
}
let hurtVal = 0, dmgFlash = 0;
function present() {
  if (gl) {
    const pr = opts.gfx === 'hoch' ? progHi : progLo;
    gl.useProgram(pr.p); gl.viewport(0, 0, cv.width, cv.height);
    gl.bindTexture(gl.TEXTURE_2D, glTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, sceneC);
    gl.uniform1i(pr.t, 0); gl.uniform2f(pr.r, VW, VH); gl.uniform1f(pr.tm, (time * 60) % 997); gl.uniform1f(pr.hurt, hurtVal);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  } else out2d.drawImage(sceneC, 0, 0);
}

// ================================================================ OPTIONEN
const opts = { sound: true, gfx: 'hoch', shake: true };
try { Object.assign(opts, JSON.parse(localStorage.getItem('aschenpfad-opts') || '{}')); } catch (e) {}
function saveOpts() { try { localStorage.setItem('aschenpfad-opts', JSON.stringify(opts)); } catch (e) {} }
function applyOpts() { muted = !opts.sound; if (master) master.gain.value = muted ? 0 : 0.45; if (muted) setMusic(false); saveOpts(); }

// ================================================================ AUDIO
let AC = null, master = null, noiseBuf = null, muted = !opts.sound, music = null, amb = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : 0.45; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 3, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    startAmbient();
  } catch (e) { AC = null; }
}
function env(g, t0, a, peak, dec) { g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + dec); }
function noise(t0, dur, type, f0, f1, peak, q = 1) {
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = type; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  const g = AC.createGain(); env(g, t0, 0.005, peak, dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t0, Math.random() * 2); s.stop(t0 + dur + 0.05);
}
function tone(t0, dur, type, f0, f1, peak) {
  const o = AC.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  const g = AC.createGain(); env(g, t0, 0.005, peak, dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
}
function sfx(n) {
  if (!AC || muted) return;
  const t = AC.currentTime;
  switch (n) {
    case 'swing': noise(t, 0.14, 'bandpass', 600, 2400, 0.22, 2); break;
    case 'swingH': noise(t, 0.24, 'bandpass', 250, 1300, 0.32, 1.5); break;
    case 'hit': noise(t, 0.12, 'lowpass', 2200, 300, 0.45); tone(t, 0.12, 'sine', 170, 60, 0.45); break;
    case 'crit': noise(t, 0.32, 'lowpass', 3200, 200, 0.6); tone(t, 0.35, 'sine', 120, 40, 0.7); tone(t, 0.25, 'triangle', 900, 300, 0.14); break;
    case 'block': tone(t, 0.25, 'triangle', 1400, 1100, 0.22); tone(t, 0.2, 'square', 2100, 1800, 0.05); noise(t, 0.08, 'highpass', 3000, 2000, 0.2); break;
    case 'parry': tone(t, 0.5, 'triangle', 1800, 1750, 0.28); tone(t + 0.03, 0.5, 'sine', 2700, 2650, 0.18); noise(t, 0.06, 'highpass', 4000, 3000, 0.2); break;
    case 'roll': noise(t, 0.18, 'lowpass', 800, 200, 0.22); break;
    case 'hurt': tone(t, 0.22, 'sawtooth', 320, 90, 0.22); noise(t, 0.1, 'lowpass', 1500, 300, 0.3); break;
    case 'death': tone(t, 1.8, 'sawtooth', 110, 40, 0.25); tone(t, 1.8, 'sine', 55, 28, 0.4); break;
    case 'boom': tone(t, 0.55, 'sine', 90, 30, 0.8); noise(t, 0.45, 'lowpass', 600, 80, 0.55); break;
    case 'jump': noise(t, 0.06, 'lowpass', 900, 400, 0.1); break;
    case 'step': noise(t, 0.05, 'lowpass', 600, 180, 0.07); break;
    case 'pickup': [660, 880, 1320].forEach((f, i) => tone(t + i * 0.07, 0.25, 'sine', f, f * 1.001, 0.13)); break;
    case 'fire': noise(t, 0.9, 'bandpass', 400, 900, 0.22, 0.7); tone(t, 0.9, 'sine', 220, 330, 0.06); break;
    case 'level': [523, 659, 784, 1046].forEach((f, i) => tone(t + i * 0.05, 0.6, 'triangle', f, f * 1.001, 0.1)); break;
    case 'bow': noise(t, 0.1, 'bandpass', 1800, 600, 0.2, 4); tone(t, 0.08, 'triangle', 300, 200, 0.1); break;
    case 'door': tone(t, 0.7, 'sawtooth', 70, 50, 0.18); noise(t, 0.7, 'lowpass', 400, 100, 0.28); break;
    case 'heal': tone(t, 0.5, 'sine', 440, 660, 0.1); break;
    case 'swap': tone(t, 0.12, 'triangle', 500, 700, 0.08); noise(t, 0.08, 'highpass', 2000, 1500, 0.08); break;
    case 'tick': tone(t, 0.05, 'triangle', 880, 880, 0.04); break;
    case 'confirm': tone(t, 0.16, 'triangle', 440, 880, 0.07); break;
    case 'back': tone(t, 0.12, 'triangle', 600, 330, 0.06); break;
    case 'thunder': noise(t, 3.2, 'lowpass', 700, 40, 0.5); tone(t, 2.6, 'sine', 52, 28, 0.32); break;
  }
}
function startAmbient() {
  if (!AC || amb) return;
  const mk = (type, f, q) => {
    const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const fl = AC.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    const g = AC.createGain(); g.gain.value = 0; s.connect(fl); fl.connect(g); g.connect(master); s.start(); return g;
  };
  amb = { rain: mk('bandpass', 2400, 0.35), wind: mk('lowpass', 360, 0.8) };
}
function updateAmbient() {
  if (!amb) return;
  const t = AC.currentTime, outdoor = 1 - chapelBlend(), on = gs !== 'quit';
  amb.rain.gain.setTargetAtTime(on ? 0.055 * outdoor + 0.006 : 0, t, 0.6);
  amb.wind.gain.setTargetAtTime(on ? 0.06 + 0.04 * Math.sin(time * 0.27) : 0, t, 0.8);
}
function setMusic(on) {
  if (!AC) return;
  if (on && !music && !muted) {
    const g = AC.createGain(); g.gain.setValueAtTime(0, AC.currentTime); g.gain.linearRampToValueAtTime(0.08, AC.currentTime + 2);
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 480; f.connect(g); g.connect(master);
    const oscs = [55, 55.35, 82.4, 110.6, 65.4].map(fr => { const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fr; o.connect(f); o.start(); return o; });
    const lfo = AC.createOscillator(); lfo.frequency.value = 0.13; const lg = AC.createGain(); lg.gain.value = 260; lfo.connect(lg); lg.connect(f.frequency); lfo.start(); oscs.push(lfo);
    music = { g, oscs };
  } else if ((!on || muted) && music) {
    const m = music; music = null; const now = AC.currentTime;
    m.g.gain.cancelScheduledValues(now); m.g.gain.setValueAtTime(m.g.gain.value, now); m.g.gain.linearRampToValueAtTime(0, now + 1.5);
    setTimeout(() => m.oscs.forEach(o => { try { o.stop(); } catch (e) {} }), 1700);
  }
}

// ================================================================ PROZEDURALE TEXTUREN
function noiseTex(w, h, cell, seed) {
  const gw = w / cell, gh = h / cell, out = new Float32Array(w * h), grid = new Float32Array(gw * gh);
  for (let i = 0; i < grid.length; i++) grid[i] = hash(i + seed * 7919, seed);
  for (let y = 0; y < h; y++) {
    const gy = y / cell, y0 = Math.floor(gy), fy = gy - y0, sy = fy * fy * (3 - 2 * fy), ya = (y0 % gh) * gw, yb = ((y0 + 1) % gh) * gw;
    for (let x = 0; x < w; x++) {
      const gx = x / cell, x0 = Math.floor(gx), fx = gx - x0, sx = fx * fx * (3 - 2 * fx), xa = x0 % gw, xb = (x0 + 1) % gw;
      const a = grid[ya + xa], b = grid[ya + xb], c = grid[yb + xa], d = grid[yb + xb];
      out[y * w + x] = (a + (b - a) * sx) + ((c + (d - c) * sx) - (a + (b - a) * sx)) * sy;
    }
  }

}
function fbm(w, h, cells, seed) {
  const o = new Float32Array(w * h); let amp = 0.5, tot = 0;
  for (const c of cells) { const n = noiseTex(w, h, c, seed++); for (let i = 0; i < o.length; i++) o[i] += n[i] * amp; tot += amp; amp *= 0.55; }
  for (let i = 0; i < o.length; i++) o[i] /= tot;
  return o;
}
function makeStone(seed, base) {
  const S = 256, c = mkCanvas(S, S), x = c.getContext('2d'), img = x.createImageData(S, S), d = img.data;
  const n = fbm(S, S, [64, 32, 16, 8], seed), fine = noiseTex(S, S, 4, seed + 5), moss = fbm(S, S, [128, 64, 32], seed + 11);
  const id = new Int32Array(S * S), edge = new Uint8Array(S * S);
  for (let row = 0; row < S / 16; row++) {
    const off = Math.floor(hash(row, seed) * 40); let x0 = off, k = 0;
    while (x0 < off + S) {
      let w = [24, 32, 40, 48, 56][Math.floor(hash(row * 37 + k, seed + 1) * 5)]; w = Math.min(w, off + S - x0);
      const bid = row * 64 + k + 1;
      for (let yy = 0; yy < 16; yy++) for (let xx = 0; xx < w; xx++) {
        const i = (row * 16 + yy) * S + ((x0 + xx) % S); id[i] = bid;
        edge[i] = (yy < 2 || xx < 2) ? 1 : (yy === 2 || xx === 2) ? 2 : (yy >= 14 || xx >= w - 2) ? 3 : 0;
      }
      x0 += w; k++;
    }
  }
  for (let i = 0; i < S * S; i++) {
    const bh = hash(id[i], seed + 3), e = edge[i];
    let l = 0.66 + (n[i] - 0.5) * 0.95 + (bh - 0.5) * 0.3 + (fine[i] - 0.5) * 0.18;
    if (e === 1) l = 0.16 + fine[i] * 0.1; else if (e === 2) l *= 1.22; else if (e === 3) l *= 0.7;
    if (e !== 1 && Math.abs(n[i] - 0.5) < 0.005 + bh * 0.004) l *= 0.4;
    let r = base[0] * l, g = base[1] * l, b = base[2] * l;
    const m = moss[i];
    if (m > 0.6 && e !== 1) { const t = Math.min(1, (m - 0.6) * 4) * 0.75; r = lerp(r, 70 * l * 1.5, t); g = lerp(g, 90 * l * 1.5, t); b = lerp(b, 50 * l * 1.5, t); }
    d[i * 4] = r; d[i * 4 + 1] = g; d[i * 4 + 2] = b; d[i * 4 + 3] = 255;
  }

}
function makeFogTex(seed, rgb, power) {
  const w = 512, h = 256, c = mkCanvas(w, h), x = c.getContext('2d'), img = x.createImageData(w, h), d = img.data, n = fbm(w, h, [128, 64, 32, 16], seed);
  for (let i = 0; i < w * h; i++) {
    const v = clamp((n[i] - 0.38) * 2.2, 0, 1);
    d[i * 4] = rgb[0]; d[i * 4 + 1] = rgb[1]; d[i * 4 + 2] = rgb[2]; d[i * 4 + 3] = Math.pow(v, power) * 255;

}
function archPath(x, cx, y, w, h) {
  x.beginPath(); x.moveTo(cx, y + h); x.lineTo(cx, y + w * 0.7);
  x.quadraticCurveTo(cx, y, cx + w / 2, y - w * 0.35); x.quadraticCurveTo(cx + w, y, cx + w, y + w * 0.7);
  x.lineTo(cx + w, y + h); x.closePath();
}
function deadTree(x, cx, cy, len, ang, w, depth, seed) {
  if (depth === 0 || w < 0.5) return;

  x.lineWidth = w; x.beginPath(); x.moveTo(cx, cy); x.lineTo(ex, ey); x.stroke();
  const n = 2 + (hash(depth * 31 + seed, (ex | 0)) > 0.6 ? 1 : 0);
  for (let i = 0; i < n; i++) {
    const h = hash((ex * 7 + i * 13) | 0, (ey * 3 + seed) | 0);

  }
}
// Hintergrund-Schichten (kachelbar, 1920 breit). gen() wird zweimal versetzt gezeichnet, damit die Naht verschwindet.
function makeLayer(gen, fogCol, fogA) {
  const c = mkCanvas(1920, 540), x = c.getContext('2d');
  for (const off of [0, -1920]) { x.save(); x.translate(off, 0); gen(x); x.restore(); }
  if (fogA > 0) {
    const g = x.createLinearGradient(0, 200, 0, 540);
    g.addColorStop(0, `rgba(${fogCol},0)`); g.addColorStop(1, `rgba(${fogCol},${fogA})`);
    x.globalCompositeOperation = 'source-atop'; x.fillStyle = g; x.fillRect(0, 0, 1920, 540);
  }

}
function genCathedral(x) {
  const col = '#262a37'; let px = 0, k = 0;
  while (px < 2500) {
    const h1 = hash(k, 1), h2 = hash(k, 2), h3 = hash(k, 3);
    const tw = 46 + h1 * 80, th = 170 + h2 * 210;
    x.fillStyle = col; x.fillRect(px, 540 - th, tw, th);
    x.beginPath(); x.moveTo(px - 4, 540 - th); x.lineTo(px + tw / 2, 540 - th - 60 - h3 * 170); x.lineTo(px + tw + 4, 540 - th); x.fill();
    for (const qx of [px - 2, px + tw - 6]) { x.beginPath(); x.moveTo(qx, 540 - th); x.lineTo(qx + 4, 540 - th - 34); x.lineTo(qx + 8, 540 - th); x.fill(); }
    for (let q = 0; q < 4; q++) {
      const wy = 540 - th + 40 + q * 60; if (wy > 500) break;
      archPath(x, px + tw / 2 - 6, wy, 12, 30); x.fillStyle = hash(k * 5, q) > 0.72 ? 'rgba(255,160,80,0.45)' : '#171a24'; x.fill();
    }
    px += tw;
    const gw = 70 + hash(k, 4) * 160, gh = 100 + hash(k, 5) * 100;
    x.fillStyle = col; x.fillRect(px, 540 - gh, gw, gh);
    x.beginPath(); x.moveTo(px - 2, 540 - gh); x.lineTo(px + gw / 2, 540 - gh - 40); x.lineTo(px + gw + 2, 540 - gh); x.fill();
    x.strokeStyle = col; x.lineWidth = 5;
    for (let q = 0; q < 2; q++) { x.beginPath(); x.arc(px + (q ? gw - 10 : 10), 540 - gh + 50, 38, q ? Math.PI * 1.5 : Math.PI, q ? Math.PI * 2 : Math.PI * 1.5); x.stroke(); }
    for (let q = 0; q < Math.floor(gw / 28); q++) { archPath(x, px + 10 + q * 28, 540 - gh + 30, 9, 24); x.fillStyle = hash(k * 7, q) > 0.8 ? 'rgba(255,150,70,0.4)' : '#171a24'; x.fill(); }
    px += gw; k++;

}
function genRuinsMid(x) {
  const col = '#191b24'; x.fillStyle = col; x.strokeStyle = col; x.lineCap = 'round';
  for (let k = 0, px = 20; px < 2400; k++) {
