}
function env(g, t0, a, peak, dec) { g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + dec); }

  f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  const g = AC.createGain(); env(g, t0, 0.005, peak, dur);

function startAmbient() {

    const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const fl = AC.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;

function updateAmbient() {

const bruteImg = {};
for (const k in BRUTE_B64) {
  const im = new Image(); im.onload = () => { const w = mkCanvas(im.width, im.height), x = w.getContext('2d'); x.drawImage(im, 0, 0); x.globalCompositeOperation = 'source-atop'; x.fillStyle = '#fff'; x.fillRect(0, 0, w.width, w.height); bruteImg[k + 'W'] = w; };
  im.src = 'data:image/png;base64,' + BRUTE_B64[k]; bruteImg[k] = im;
}
DRAW_TYPE.brute = (e, c) => {
  const a = e.atk || e.def.attacks[0], run = Math.abs(e.vx) > 15;
  let f = 'idle', lean = 0, bob = 0, ox = 0;
  if (e.state === 'wind') { f = 'wind'; lean = -0.05 * ease(clamp(e.t / a.wind, 0, 1)); }
  else if (e.state === 'act') f = 'strike';
  else if (e.state === 'rec') f = e.t < a.rec * 0.45 ? 'follow' : 'idle';
  else if (e.state === 'hurt' || e.state === 'parried') { f = 'idle'; lean = -0.12; ox = -3; }
  else if (run) { f = Math.floor(time * 4.5 + e.seed) % 2 ? 'walk1' : 'walk0'; bob = -Math.abs(Math.sin(time * 9 + e.seed)) * 1.5; }
  else bob = Math.sin(time * 2 + e.seed) * 0.5;
  const im = bruteImg[f], m = BRUTE_META[f]; if (!im || !im.complete) return;
  ctx.scale(1 / 1.18, 1 / 1.18); ctx.save(); ctx.translate(ox, bob); ctx.rotate(lean); ctx.imageSmoothingEnabled = false;
  ctx.drawImage(e.flash > 0 && bruteImg[f + 'W'] ? bruteImg[f + 'W'] : im, -m.ax, -m.ay);
  ctx.imageSmoothingEnabled = true; ctx.restore();
};

const SMITH_LINES = ['„Bring mir Schmiedesteine, dann lasse ich deine Klinge singen.“', '„Stahl vergisst nicht. Und ich auch nicht.“', '„Noch ein Schlag … dann sitzt die Schneide.“'];
const MERCH_LINES = ['„Seelen gegen Waren. Fair ist, was überlebt.“', '„Ich habe Dinge gesehen, die du lieber nicht kaufst … aber diese hier schon.“'];
function upgradeCost(lv) { return { souls: Math.round(500 * Math.pow(lv + 1, 1.6)), stones: lv + 1 }; }
function openSmith() {
  gs = 'menu';
  const line = SMITH_LINES[Math.floor(time) % SMITH_LINES.length];
  const items = world.weapons.map(id => {
    const w = WEAPONS[id];
    return { label: w.name + ' +' + (world.wlevel[id] || 0),
      info: () => { const lv = world.wlevel[id] || 0; if (lv >= 5) return 'Höchststufe'; const c = upgradeCost(lv); return `→ +${lv + 1}  ·  ${c.souls} Seelen, ${c.stones} Stein${c.stones > 1 ? 'e' : ''}`; },
      action: () => {
        const lv = world.wlevel[id] || 0; if (lv >= 5) { toast('Mehr geht nicht.'); return; }
        const c = upgradeCost(lv);

// ================================================================ BILDGRÖSSE / VOLLBILD
let fitKey = '';
function fit() {
  const vv = window.visualViewport;
  const w = vv ? vv.width : innerWidth, h = vv ? vv.height : innerHeight;
  const key = w + 'x' + h; if (key === fitKey) return; fitKey = key;
  const s = Math.min(w / VW, h / VH);

}

const fsBtn = document.getElementById('fs');

let last = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - last) / 1000; last = now; if (dt > 0.1) dt = 0.1;
  acc += dt;
